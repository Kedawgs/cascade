[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Bittensor EVM docs: compile with Solidity <= 0.8.24, EVM target Cancun.
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false
