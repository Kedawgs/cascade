[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Bittensor EVM docs: compile with Solidity <= 0.8.24, EVM target Cancun.
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# The rehearsal stand-ins force-send with selfdestruct on purpose (local forks only).
ignored_warnings_from = ["test/rehearsal"]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[fmt]
# Vendored Chainlink files must stay byte-identical to the package.
ignore = ["src/vendor/**", "src/vendor/uniswap/**", "test/vendor/**"]
